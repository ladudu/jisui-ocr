[project]
name = "jisui-ocr"
version = "0.1.0"
description = "日文竖排纸书「自炊」流水线 PoC：翻书视频 → 每页最佳帧 → 竖排 OCR → 竖排 EPUB"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# 云端 VLM（Claude）对比用。只在阶段 0 少量试用。
cloud = ["anthropic>=0.70", "pillow>=11"]

[project.scripts]
jisui = "jisui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jisui"]

[dependency-groups]
dev = ["pytest>=8"]
